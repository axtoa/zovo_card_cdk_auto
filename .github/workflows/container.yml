name: Container image

on:
  push:
    branches: [master]
    tags: ['v*']
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Caddy configuration
        if: matrix.arch == 'amd64'
        run: |
          docker run --rm -e SITE_DOMAIN=shop.aisale.best \
            -v "$GITHUB_WORKSPACE/deploy/Caddyfile.image:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Image name and application version
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ steps.image.outputs.name }}:build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
          build-args: |
            APP_VERSION=${{ steps.image.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Check image health
        env:
          IMAGE: ${{ steps.image.outputs.name }}:build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
        run: |
          docker run -d --name smoke --env JWT_SECRET="$(openssl rand -hex 32)" "$IMAGE"
          for attempt in $(seq 1 30); do
            if docker exec smoke curl -fsS http://127.0.0.1:8080/health; then
              docker rm -f smoke
              exit 0
            fi
            sleep 2
          done
          docker logs smoke
          docker rm -f smoke
          exit 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=long
            type=ref,event=tag
            type=semver,pattern={{version}}

      - name: Publish multi-platform manifest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAGS: ${{ steps.meta.outputs.tags }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          args=()
          while IFS= read -r tag; do
            [[ -z "$tag" ]] || args+=(--tag "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" \
            "$IMAGE:build-$RUN_ID-$RUN_ATTEMPT-amd64" \
            "$IMAGE:build-$RUN_ID-$RUN_ATTEMPT-arm64"
          docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA"

      - name: Published image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "### Published container" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$TAGS" >> "$GITHUB_STEP_SUMMARY"
          echo 'Platforms: linux/amd64, linux/arm64' >> "$GITHUB_STEP_SUMMARY"
